 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Code Detective</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    padding: 20px;
}

.box {
    max-width: 600px;
    margin: 40px auto;
    padding: 25px;
    background: #244447;
    border-radius: 15px;
}

input, button {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    background: #3182ce;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2563a8;
}

.option {
    background: #f3e4c8;
    color: #222;
}

#game, #result {
    display: none;
}
</style>
</head>

<body>

<div class="box" id="start">
    <h1>🔎 C Code Detective</h1>
    <p>Find the bug. Become a coding detective!</p>

    <input id="player" placeholder="Enter your name">

    <button onclick="startGame()">START GAME</button>
</div>

<div class="box" id="game">
    <h2 id="welcome"></h2>
    <h3 id="level"></h3>
    <p id="progress"></p>
    <h3 id="question"></h3>

    <div id="options"></div>

    <p id="feedback"></p>
    <button id="next" onclick="nextQuestion()" style="display:none">
        NEXT QUESTION
    </button>
</div>

<div class="box" id="result">
    <h1>🎉 Game Completed!</h1>
    <h2 id="finalName"></h2>
    <h2 id="finalScore"></h2>
    <button onclick="playAgain()">PLAY AGAIN</button>
</div>

<script>

const questions = [
    // EASY LEVEL
    [
        {
            q: "Find the bug: int main() { int a = 5; printf('%d', a); }",
            options: ["Missing semicolon", "Wrong quotes in printf", "Wrong variable", "No bug"],
            answer: 1
        },
        {
            q: "Find the bug: int main() { int x = 10; if(x = 5) printf('Yes'); }",
            options: ["Assignment used instead of comparison", "Missing variable", "Wrong data type", "No bug"],
            answer: 0
        }
    ],

    // MEDIUM LEVEL
    [
        {
            q: "Find the bug: int main() { int a[3] = {1,2,3}; printf('%d', a[3]); }",
            options: ["Array size is wrong", "Index is out of bounds", "Missing array", "No bug"],
            answer: 1
        },
        {
            q: "Find the bug: int main() { int x; printf('%d', x); }",
            options: ["x is uninitialized", "printf is missing", "Wrong loop", "No bug"],
            answer: 0
        }
    ],

    // HARD LEVEL
    [
        {
            q: "Find the bug: int main() { int *p; *p = 10; }",
            options: ["Pointer is not initialized", "Wrong integer", "Missing loop", "No bug"],
            answer: 0
        },
        {
            q: "Find the bug: int main() { int a = 5; int *p = a; }",
            options: ["Pointer should store address", "Wrong variable name", "Missing semicolon", "No bug"],
            answer: 0
        }
    ]
];

let levelIndex = 0;
let questionIndex = 0;
let score = 0;
let playerName = "";
let answered = false;

function startGame() {
    playerName = document.getElementById("player").value.trim();

    if (playerName === "") {
        alert("Please enter your name!");
        return;
    }

    levelIndex = 0;
    questionIndex = 0;
    score = 0;

    document.getElementById("start").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("welcome").innerText =
        "Welcome Detective " + playerName + "!";

    showQuestion();
}

function showQuestion() {
    answered = false;

    const current = questions[levelIndex][questionIndex];

    document.getElementById("level").innerText =
        ["Easy Level", "Medium Level", "Hard Level"][levelIndex];

    document.getElementById("progress").innerText =
        "Question " + (questionIndex + 1) + " of 2 | Score: " + score + "/60";

    document.getElementById("question").innerText = current.q;
    document.getElementById("feedback").innerText = "";
    document.getElementById("next").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    current.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.className = "option";

        button.onclick = function() {
            checkAnswer(index);
        };

        optionsDiv.appendChild(button);
    });
}

function checkAnswer(selected) {
    if (answered) return;

    answered = true;

    const current = questions[levelIndex][questionIndex];

    if (selected === current.answer) {
        score += 10;
        document.getElementById("feedback").innerText =
            "✅ Correct! +10 Marks";
    } else {
        document.getElementById("feedback").innerText =
            "❌ Wrong Answer! 0 Marks";
    }

    document.getElementById("progress").innerText =
        "Question " + (questionIndex + 1) + " of 2 | Score: " + score + "/60";

    document.getElementById("next").style.display = "block";
}

function nextQuestion() {
    questionIndex++;

    if (questionIndex >= 2) {
        levelIndex++;
        questionIndex = 0;
    }

    if (levelIndex >= 3) {
        showResult();
    } else {
        showQuestion();
    }
}

function showResult() {
    document.getElementById("game").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalName").innerText =
        "Detective: " + playerName;

    document.getElementById("finalScore").innerText =
        "Your Final Score: " + score + "/60";
}

function playAgain() {
    document.getElementById("result").style.display = "none";
    document.getElementById("start").style.display = "block";
}

</script>

</body>
</html>
