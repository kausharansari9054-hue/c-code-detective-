 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Code Detective - Bug Hunter</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    text-align: center;
    padding: 15px;
}

.box {
    max-width: 650px;
    margin: 35px auto;
    padding: 25px;
    background: #244447;
    border-radius: 15px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    background: #3182ce;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2563a8;
}

.option {
    background: #f3e4c8;
    color: #222;
}

.option:disabled {
    cursor: default;
    opacity: 0.8;
}

#game, #result {
    display: none;
}

#feedback {
    text-align: left;
    line-height: 1.6;
    background: #182f32;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div class="box" id="start">
    <h1>🔎 C Code Detective</h1>
    <p>Find the bugs and become a coding detective!</p>

    <input id="player" placeholder="Enter your name">

    <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME SCREEN -->
<div class="box" id="game">
    <h2 id="welcome"></h2>
    <h3 id="level"></h3>
    <p id="progress"></p>

    <h3 id="question"></h3>

    <div id="options"></div>

    <div id="feedback" style="display:none"></div>

    <button id="next" onclick="nextQuestion()" style="display:none">
        NEXT QUESTION
    </button>
</div>

<!-- RESULT SCREEN -->
<div class="box" id="result">
    <h1>🎉 Game Completed!</h1>
    <h2 id="finalName"></h2>
    <h2 id="finalScore"></h2>
    <p id="resultMessage"></p>

    <button onclick="playAgain()">PLAY AGAIN</button>
</div>

<script>

const questions = [

    // EASY LEVEL
    [
        {
            q: "Find the bug: int main() { int a = 5 printf(\"%d\", a); }",
            options: [
                "Missing semicolon after 5",
                "Wrong variable",
                "Wrong data type",
                "No bug"
            ],
            answer: 0,
            explanation: "Every C statement must end with a semicolon. Add ; after int a = 5."
        },

        {
            q: "Find the bug: int x = 10; if(x = 5) printf(\"Yes\");",
            options: [
                "Assignment used instead of comparison",
                "Missing variable",
                "Wrong data type",
                "No bug"
            ],
            answer: 0,
            explanation: "The = operator assigns a value. Use == to compare two values in an if condition."
        }
    ],

    // MEDIUM LEVEL
    [
        {
            q: "Find the bug: int a[3] = {1,2,3}; printf(\"%d\", a[3]);",
            options: [
                "Array size is wrong",
                "Index is out of bounds",
                "Missing array",
                "No bug"
            ],
            answer: 1,
            explanation: "An array of size 3 has indexes 0, 1, and 2. a[3] is outside the array."
        },

        {
            q: "Find the bug: int x; printf(\"%d\", x);",
            options: [
                "x is uninitialized",
                "printf is missing",
                "Wrong loop",
                "No bug"
            ],
            answer: 0,
            explanation: "The local variable x has not been initialized. Give it a value before using it."
        }
    ],

    // HARD LEVEL
    [
        {
            q: "Find the bug: int *p; *p = 10;",
            options: [
                "Pointer is not initialized",
                "Wrong integer",
                "Missing loop",
                "No bug"
            ],
            answer: 0,
            explanation: "The pointer p does not point to a valid memory location. Assign it a valid address before dereferencing it."
        },

        {
            q: "Find the bug: int a = 5; int *p = a;",
            options: [
                "Pointer should store an address",
                "Wrong variable name",
                "Missing semicolon",
                "No bug"
            ],
            answer: 0,
            explanation: "A pointer stores an address. Use int *p = &a; to store the address of a."
        }
    ]

];

let levelIndex = 0;
let questionIndex = 0;
let score = 0;
let playerName = "";
let answered = false;

const levelNames = ["Easy", "Medium", "Hard"];

// START GAME
function startGame() {

    playerName = document.getElementById("player").value.trim();

    if (playerName === "") {
        alert("Please enter your name!");
        return;
    }

    levelIndex = 0;
    questionIndex = 0;
    score = 0;

    document.getElementById("start").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("game").style.display = "block";

    document.getElementById("welcome").innerText =
        "Welcome Detective " + playerName + "!";

    showQuestion();
}

// SHOW QUESTION
function showQuestion() {

    answered = false;

    const current = questions[levelIndex][questionIndex];

    document.getElementById("level").innerText =
        levelNames[levelIndex] + " Level";

    document.getElementById("progress").innerText =
        "Question " + (questionIndex + 1) + " of 2 | Score: " + score + "/60";

    document.getElementById("question").innerText = current.q;

    document.getElementById("feedback").style.display = "none";
    document.getElementById("feedback").innerHTML = "";

    document.getElementById("next").style.display = "none";

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    current.options.forEach(function(option, index) {

        const button = document.createElement("button");

        button.innerText = option;
        button.className = "option";

        button.onclick = function() {
            checkAnswer(index);
        };

        optionsDiv.appendChild(button);
    });
}

// CHECK ANSWER
function checkAnswer(selected) {

    if (answered) return;

    answered = true;

    const current = questions[levelIndex][questionIndex];
    const correctOption = current.options[current.answer];

    const feedback = document.getElementById("feedback");

    if (selected === current.answer) {

        score += 10;

        feedback.innerHTML =
            "✅ <b>Correct Answer! +10 Marks</b><br><br>" +
            "<b>Correct Answer:</b> " + correctOption +
            "<br><br><b>Explanation:</b> " + current.explanation;

    } else {

        feedback.innerHTML =
            "❌ <b>Wrong Answer! 0 Marks</b><br><br>" +
            "<b>Correct Answer:</b> " + correctOption +
            "<br><br><b>Explanation:</b> " + current.explanation;
    }

    feedback.style.display = "block";

    document.getElementById("progress").innerText =
        "Question " + (questionIndex + 1) + " of 2 | Score: " + score + "/60";

    // Disable all options after answering
    const buttons = document.querySelectorAll(".option");

    buttons.forEach(function(button) {
        button.disabled = true;
    });

    document.getElementById("next").style.display = "block";
}

// NEXT QUESTION / NEXT LEVEL
function nextQuestion() {

    questionIndex++;

    // Move to next level after 2 questions
    if (questionIndex >= 2) {
        levelIndex++;
        questionIndex = 0;
    }

    // All 3 levels completed
    if (levelIndex >= 3) {
        showResult();
    } else {
        showQuestion();
    }
}

// FINAL RESULT
function showResult() {

    document.getElementById("game").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("finalName").innerText =
        "Detective: " + playerName;

    document.getElementById("finalScore").innerText =
        "Overall Score: " + score + "/60";

    if (score === 60) {
        document.getElementById("resultMessage").innerText =
            "Excellent! You found every bug!";
    } else {
        document.getElementById("resultMessage").innerText =
            "Good job! Keep practicing your C programming.";
    }
}

// PLAY AGAIN
function playAgain() {

    document.getElementById("result").style.display = "none";
    document.getElementById("start").style.display = "block";

    document.getElementById("player").value = "";
}

</script>

</body>
</html>
