<!DOCTYPE html>
<html>
<head>
    <title>C Code Detective - Bug Hunter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .game {
            max-width: 550px;
            margin: 30px auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #334155;
        }

        h1 {
            color: #38bdf8;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        pre {
            background: #020617;
            color: #4ade80;
            padding: 18px;
            border-radius: 8px;
            text-align: left;
            overflow-x: auto;
        }

        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        .info {
            color: #cbd5e1;
        }

        #result {
            font-weight: bold;
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>🔎 C Code Detective</h1>
    <p class="info">Find the bug. Become a coding detective!</p>

    <!-- START SCREEN -->

    <div id="startScreen" class="screen active">

        <h2>Welcome Detective!</h2>

        <input type="text" id="playerName"
               placeholder="Enter your name">

        <select id="level">
            <option value="Easy">Easy Level</option>
            <option value="Medium">Medium Level</option>
            <option value="Hard">Hard Level</option>
        </select>

        <h3 id="startOverall">Overall Score: 0</h3>

        <button onclick="startGame()">START GAME</button>

    </div>

    <!-- GAME SCREEN -->

    <div id="gameScreen" class="screen">

        <h3 id="playerInfo"></h3>

        <p id="questionNumber"></p>

        <h3 id="question"></h3>

        <pre id="code"></pre>

        <div id="options"></div>

        <p id="result"></p>

        <h3 id="currentScore">Current Score: 0</h3>

        <h3 id="gameOverall">Overall Score: 0</h3>

        <button id="nextButton" onclick="nextQuestion()" hidden>
            NEXT QUESTION
        </button>

    </div>

    <!-- GAME OVER SCREEN -->

    <div id="endScreen" class="screen">

        <h2>🎉 GAME OVER 🎉</h2>

        <h3 id="finalPlayer"></h3>

        <h3 id="finalLevel"></h3>

        <h3 id="finalScore"></h3>

        <h3 id="finalOverall"></h3>

        <button onclick="playAgain()">PLAY AGAIN</button>

    </div>

</div>

<script>

    let playerName = "";
    let selectedLevel = "Easy";
    let current = 0;
    let score = 0;
    let questions = [];

    let overallScore = Number(localStorage.getItem("detectiveScore")) || 0;

    const questionBank = {

        Easy: [
            {
                question: "What is missing in this code?",
                code: "int a = 5",
                options: ["Bracket", "Semicolon", "Variable"],
                answer: 1
            },
            {
                question: "Which operator compares two values?",
                code: "if (a = 10)",
                options: ["==", "=", "+="],
                answer: 0
            }
        ],

        Medium: [
            {
                question: "Find the error in this code.",
                code: "printf(\"Hello\")",
                options: ["Missing semicolon", "Wrong variable", "No error"],
                answer: 0
            },
            {
                question: "Which is the invalid variable name?",
                code: "int 2num = 10;",
                options: ["2num", "num2", "number"],
                answer: 0
            }
        ],

        Hard: [
            {
                question: "What is the problem with this loop?",
                code: "for(i = 0; i < 5; i--)",
                options: ["i decreases", "Missing bracket", "No error"],
                answer: 0
            },
            {
                question: "Find the error.",
                code: "int a;\nprintf(\"%d\", b);",
                options: ["Missing semicolon", "b is undeclared", "No error"],
                answer: 1
            }
        ]

    };

    function showScreen(screenId) {

        document.getElementById("startScreen").classList.remove("active");
        document.getElementById("gameScreen").classList.remove("active");
        document.getElementById("endScreen").classList.remove("active");

        document.getElementById(screenId).classList.add("active");

    }

    function startGame() {

        playerName = document.getElementById("playerName").value.trim();

        selectedLevel = document.getElementById("level").value;

        if (playerName === "") {
            alert("Please enter your name!");
            return;
        }

        score = 0;
        current = 0;

        questions = questionBank[selectedLevel];

        document.getElementById("playerInfo").textContent =
            "Player: " + playerName + " | Level: " + selectedLevel;

        showScreen("gameScreen");

        showQuestion();

    }

    function showQuestion() {

        document.getElementById("questionNumber").textContent =
            "Question " + (current + 1) + " / " + questions.length;

        document.getElementById("question").textContent =
            questions[current].question;

        document.getElementById("code").textContent =
            questions[current].code;

        document.getElementById("result").textContent = "";

        document.getElementById("currentScore").textContent =
            "Current Score: " + score;

        document.getElementById("gameOverall").textContent =
            "Overall Score: " + overallScore;

        document.getElementById("nextButton").hidden = true;

        const optionsBox = document.getElementById("options");

        optionsBox.innerHTML = "";

        questions[current].options.forEach(function(option, index) {

            let button = document.createElement("button");

            button.textContent = (index + 1) + ". " + option;

            button.onclick = function() {
                checkAnswer(index);
            };

            optionsBox.appendChild(button);

        });

    }

    function checkAnswer(choice) {

        const buttons = document.querySelectorAll("#options button");

        buttons.forEach(function(button) {
            button.disabled = true;
        });

        if (choice === questions[current].answer) {

            score += 10;
            overallScore += 10;

            localStorage.setItem("detectiveScore", overallScore);

            document.getElementById("result").textContent =
                "Correct Answer! +10 Points";

        } else {

            document.getElementById("result").textContent =
                "Wrong Answer! Correct answer: " +
                questions[current].options[questions[current].answer];

        }

        document.getElementById("currentScore").textContent =
            "Current Score: " + score;

        document.getElementById("gameOverall").textContent =
            "Overall Score: " + overallScore;

        if (current === questions.length - 1) {

            document.getElementById("nextButton").textContent =
                "SHOW RESULT";

        } else {

            document.getElementById("nextButton").textContent =
                "NEXT QUESTION";

        }

        document.getElementById("nextButton").hidden = false;

    }

    function nextQuestion() {

        if (current === questions.length - 1) {

            showResult();

        } else {

            current++;

            showQuestion();

        }

    }

    function showResult() {

        document.getElementById("finalPlayer").textContent =
            "Player: " + playerName;

        document.getElementById("finalLevel").textContent =
            "Level: " + selectedLevel;

        document.getElementById("finalScore").textContent =
            "Your Score: " + score;

        document.getElementById("finalOverall").textContent =
            "Overall Score: " + overallScore;

        showScreen("endScreen");

    }

    function playAgain() {

        document.getElementById("startOverall").textContent =
            "Overall Score: " + overallScore;

        showScreen("startScreen");

    }

    document.getElementById("startOverall").textContent =
        "Overall Score: " + overallScore;

</script>

</body>
</html>
